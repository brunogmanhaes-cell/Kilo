{% macro brand_mark(link_to="/") %}
<a href="{{ link_to }}" class="brand-lockup">
  <svg class="brand-pencil-mini" viewBox="0 0 56 20" fill="none" aria-hidden="true">
    <polygon points="1,10 11,2 11,18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="1,10 5.5,6.4 5.5,13.6" fill="currentColor"/>
    <rect x="11" y="2" width="36" height="16" rx="1" fill="currentColor"/>
    <rect x="47" y="2" width="4" height="16" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path d="M51 2 H53.5 A1.5 1.5 0 0 1 55 3.5 V16.5 A1.5 1.5 0 0 1 53.5 18 H51 Z" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.4"/>
    <text x="29" y="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.2" font-weight="800" letter-spacing="-0.3" fill="var(--bg)">100kg</text>
  </svg>
  <span class="wordmark">Kilo</span>
</a>
{% endmacro %}
