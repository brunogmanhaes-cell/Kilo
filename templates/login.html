<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Kilo</title>
  <script>
    (function () {
      var t = localStorage.getItem("kilo-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-page">
  <button id="theme-toggle" type="button" class="btn btn-ghost btn-icon auth-theme-corner" title="Alternar tema" aria-label="Alternar tema"></button>

  <main class="auth-box">
    <h1 class="auth-title">Entrar no Kilo</h1>
    <p class="auth-subtitle">Acesse suas notas privadas</p>

    {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('views.login') }}">
      {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}

      <div class="field">
        <label for="identifier">Usuário ou e-mail</label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          class="input"
          value="{{ identifier or '' }}"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <div class="auth-footer-link">
      Não tem conta? <a href="{{ url_for('views.register') }}">Criar conta</a>
    </div>
  </main>

  <script type="module">
    import { initThemeToggle } from "{{ url_for('static', filename='js/theme.js') }}";
    initThemeToggle(document.getElementById("theme-toggle"));
  </script>
</body>
</html>
